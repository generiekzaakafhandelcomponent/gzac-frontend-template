name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to be released'
        required: true

env:
  DOCKER_REPO: ritense/gzac-frontend

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Upgrade version
        run: |
          sed -r -i 's/"@valtimo\/([a-z0-9_-]+)".+/"@valtimo\/\1": "${{ inputs.version }}",/' package.json

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Commit version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Upgrade to ${{ inputs.version }}"
          git push

      - name: Build application
        run: npm run build
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and push image
        run: |
          docker build -t ${{ env.DOCKER_REPO }}:${{ inputs.version }} .
          docker push ${{ env.DOCKER_REPO }}:${{ inputs.version }}
