name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to be released'
        required: true
  repository_dispatch:
    types: [release]

env:
  VERSION: ${{ inputs.version || github.event.client_payload.version }}

  DOCKER_REPO: ritense/gzac-frontend

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Upgrade version
        run: |
          sed -r -i 's/"@valtimo\/([a-z0-9_-]+)".+/"@valtimo\/\1": "${{ env.VERSION }}",/' package.json

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Commit version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Upgrade to ${{ env.VERSION }}"
          git tag -a "${{ env.VERSION }}" -m "Release ${{ env.VERSION }}"
          git push origin HEAD
          git push origin "${{ env.VERSION }}"

      - name: Build application
        run: npm run build
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and push image
        run: |
          docker build -t ${{ env.DOCKER_REPO }}:${{ env.VERSION }} .
          docker push ${{ env.DOCKER_REPO }}:${{ env.VERSION }}
